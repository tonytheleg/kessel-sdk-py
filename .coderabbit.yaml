# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# See https://docs.coderabbit.ai/reference/configuration for all fields and default values
knowledge_base:
  learnings:
    scope: global
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/CONTRIBUTING.md"
      - "**/GUIDELINES.md"
  linked_repositories:
    - repository: "RedHatInsights/insights-host-inventory"
      instructions: |
        Primary consumer of kessel-sdk-py. Uses the SDK as its authorization layer (RBAC v2) across all REST endpoints. Depends on hand-written SDK modules: ClientBuilder (kessel.inventory.v1beta2), OAuth2ClientCredentials and fetch_oidc_discovery (kessel.auth), principal_from_rh_identity (kessel.console), list_workspaces (kessel.rbac.v2). Also imports generated protobuf types directly: CheckRequest, CheckBulkRequest, CheckResponse, CheckForUpdateResponse, ResourceReference, ReporterReference, SubjectReference, Allowed enum. Pins to a specific kessel-sdk[auth] version and requires a coordinated release for breaking changes. Breaking changes to watch: ClientBuilder method signatures or build() return type, renaming or moving principal_from_rh_identity or list_workspaces, changes to the kessel.auth public API (OAuth2ClientCredentials constructor, fetch_oidc_discovery return shape), removing or renaming protobuf message types under kessel.inventory.v1beta2. Proto-level changes are caught by buf CI, but hand-written module changes (auth, console, rbac.v2, ClientBuilder) are not.
